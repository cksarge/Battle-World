<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Operator lab</title>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/" } }</script>
<style>
  body { margin: 0; background: #15181d; color: #ddd; font: 13px/1.4 ui-monospace, monospace; overflow: hidden; }
  #ui { position: fixed; top: 8px; left: 8px; z-index: 2; display: flex; gap: 8px; flex-wrap: wrap; }
  select, button { background: #222831; color: #ddd; border: 1px solid #3a4250; padding: 4px 6px; font: inherit; }
</style>
</head>
<body>
<!-- Dev tool: every operator preset, or one operator with any hair / face / headgear / vest. Drag to orbit, scroll to zoom. -->
<div id="ui">
  <select id="who"><option value="">All operators</option><option value="zombie">Zombies</option><option value="custom">Custom</option></select>
  <select id="hair"></select><select id="face"></select><select id="headgear"></select><select id="vest"></select><select id="build"></select>
  <select id="team"><option value="-1">No team</option><option value="0">Attackers</option><option value="1">Defenders</option></select>
  <select id="pose"><option value="aim">Aim</option><option value="run">Run</option><option value="crouch">Crouch</option><option value="wave">Wave</option></select>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CharacterModel } from '../js/engine/models.js';
import { OPERATORS, CHAR_OPTIONS, DEFAULT_CHAR } from '../js/data/characters.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b2028);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x2a241e, 1.1));
const sun = new THREE.DirectionalLight(0xfff0dd, 2.6); sun.position.set(2.5, 5, 4); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 4, bottom: -2 }); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), new THREE.MeshStandardMaterial({ color: 0x2a2f36, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 60);
const controls = new OrbitControls(camera, renderer.domElement);
const $ = (id) => document.getElementById(id);
for (const k of ['hair', 'face', 'headgear', 'vest', 'build']) for (const v of CHAR_OPTIONS[k]) $(k).add(new Option(`${k}: ${v}`, v));
const q = new URLSearchParams(location.search);
for (const k of ['who', 'hair', 'face', 'headgear', 'vest', 'build', 'team', 'pose']) if (q.has(k)) $(k).value = q.get(k);
let models = [], t = 0;

function rebuild() {
  models.forEach((m) => m.root.removeFromParent());
  const who = $('who').value, team = +$('team').value;
  let chars;
  if (who === 'custom') chars = [{ ...DEFAULT_CHAR, hair: $('hair').value, face: $('face').value, headgear: $('headgear').value, vest: $('vest').value, build: $('build').value }];
  else if (who === 'zombie') chars = ['walker', 'infected', 'brute'].map((z, i) => ({ ...OPERATORS[i].char, zombie: z }));
  else chars = OPERATORS.map((o) => o.char);
  models = chars.map((c, i) => {
    const m = new CharacterModel(c, { team });
    m.root.position.x = (i - (chars.length - 1) / 2) * 0.9;
    m.root.rotation.y = Math.PI - 0.35;
    m.setWeapon('ar7');
    scene.add(m.root);
    return m;
  });
  const one = chars.length === 1;
  controls.target.set(0, one ? 1.05 : 1.0, 0);
  camera.position.set(0, one ? 1.25 : 1.3, one ? 3.2 : 8.5);
  history.replaceState(null, '', '?' + new URLSearchParams(Object.fromEntries(['who', 'hair', 'face', 'headgear', 'vest', 'build', 'team', 'pose'].map((k) => [k, $(k).value]))));
}
document.querySelectorAll('select').forEach((s) => s.addEventListener('change', rebuild));
rebuild();
window.lab = { models, camera, controls };

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  const pose = $('pose').value;
  for (const m of models) {
    if (pose === 'wave' && !m.emote) m.playEmote('wave', 2.4);
    if (pose !== 'wave' && m.emote) m.stopEmote();
    m.update(dt, { speed: pose === 'run' ? 5 : 0, crouch: pose === 'crouch' ? 1 : 0, pitch: 0, onGround: true, firing: false });
  }
  const w = innerWidth, h = innerHeight;
  if (renderer.domElement.width !== Math.floor(w * renderer.getPixelRatio())) { renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
